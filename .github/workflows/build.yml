name: build
on: [push, pull_request, workflow_dispatch]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: XML regression checks
        shell: pwsh
        run: ./Tests/Check-Mod.ps1
      - name: Translation coverage and validator negative cases
        run: python3 Tests/Check-Translations.py --self-test
      - name: Compile
        run: dotnet build Source/AlphaMythologyRenew.csproj -c Release --nologo
      - name: Validator negative cases
        shell: pwsh
        run: ./Tests/Test-Validator.ps1
      - name: Settings rules unit tests
        run: dotnet run --project Tests/UnitTests/UnitTests.csproj -c Release
