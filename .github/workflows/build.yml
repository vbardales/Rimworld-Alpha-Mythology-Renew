name: build
on: [push, pull_request, workflow_dispatch]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile
        run: dotnet build Source/AlphaMythologyRenew.csproj -c Release --nologo
      - name: Settings rules unit tests
        run: dotnet run --project Tests/UnitTests/UnitTests.csproj -c Release
  mod-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shared checks and own values
        shell: powershell
        run: ./Tests/Test-Mod.ps1
