name: build
on: [push, pull_request, workflow_dispatch]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: XML regression checks
        shell: pwsh
        run: ./Tests/Check-Mod.ps1
      - name: Compile
        run: dotnet build Source/AlphaMythologyRenew.csproj -c Release --nologo
