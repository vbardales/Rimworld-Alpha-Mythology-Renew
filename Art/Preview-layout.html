:root{--veil:#384048;--inkPrimary:#F2ECE1;--inkSecondary:#BEDFFF;--accent:#F5A126;--badgeInk:#17120E;--iconOutline:var(--accent)}*{margin:0;padding:0;box-sizing:border-box}

@property --lueur{syntax:'<percentage>';inherits:false;initial-value:24%}
